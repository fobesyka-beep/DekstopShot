[project]
name = "dekstopshot"
version = "1.3.0"
description = "A glass-style Windows screenshot app with tray, monitor and window capture"
requires-python = ">=3.10,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".python312", ".venv-python315-backup"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
